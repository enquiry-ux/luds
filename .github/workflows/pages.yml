# Publishes apps/midsleep/dist as the site root, so the installable app lives at
# the repository's Pages URL.
#
# Requires Pages to be switched on once, by a repository admin, with
# Settings -> Pages -> Source: GitHub Actions. The GITHUB_TOKEN available here
# can deploy to Pages but cannot create the Pages site itself, so that one step
# cannot be automated.
name: Deploy Midsleep

on:
  push:
    branches: ["claude/app-creation-f75ej5"]
    paths:
      - "apps/midsleep/dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/midsleep/dist
      - id: deployment
        uses: actions/deploy-pages@v4
